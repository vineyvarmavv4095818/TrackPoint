<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TrackPoint · ISS Real-Time Tracker{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a href="/" class="brand">
        <img src="{{ url_for('static', filename='images/iss-marker.png') }}" alt="">
        <span>TrackPoint<small>ISS Real-Time Tracker</small></span>
    </a>
    <nav class="nav">
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}><i class="fa-solid fa-house-chimney"></i> Home</a>
        <a href="/astronauts" {% if request.path == '/astronauts' %}class="active"{% endif %}><i class="fa-solid fa-user-astronaut"></i> Astronauts</a>
        <a href="/about" {% if request.path == '/about' %}class="active"{% endif %}><i class="fa-solid fa-circle-info"></i> About</a>
    </nav>
    <div class="clock">
        <span class="live"><i class="live-dot"></i>Live</span>
        <div id="utc-time"></div>
        <div id="utc-date"></div>
        <div id="utc-day"></div>
        <div id="iss-status"></div>
    </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="footer">
    <div><strong>TrackPoint</strong> · ISS Real-Time Tracker</div>
    <div class="footer-links">
        <a href="https://github.com/vineyvarmavv4095818" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-github"></i> GitHub
        </a>
    </div>
    <div>Powered by Where The ISS At, N2YO &amp; Leaflet · © 2026 TrackPoint</div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='JS/clock.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
